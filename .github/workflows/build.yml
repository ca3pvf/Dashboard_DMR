name: Compilar portable
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,  name: windows-x64 }
          - { os: ubuntu-24.04,     name: linux-x64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
          - { os: macos-latest,    name: macos-arm64 }
          - { os: macos-15-intel,  name: macos-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compilar (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: build.bat
      - name: Compilar (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: bash build.sh
      - name: Empaquetar
        shell: bash
        run: |
          cd dist
          V="${GITHUB_REF_NAME}"
          case "$V" in v[0-9]*) ;; *) V="dev" ;; esac
          N="pcbox-portable-${{ matrix.name }}-$V"
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv pcbox-portable.exe "$N.exe"
          else
            mv pcbox-portable "$N"
            tar czf "$N.tar.gz" "$N"
            rm "$N"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pcbox-${{ matrix.name }}
          path: dist/pcbox-portable-*
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pcbox-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            configurar_ssh.sh
            configurar_ssh.bat
            INSTALACION.md
